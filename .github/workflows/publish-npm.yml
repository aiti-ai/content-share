# publish-npm.yml — publish @aiti-ai/content-share to the npm official registry.
#
# Trigger: workflow_dispatch (manual, per project release discipline — CI only)
#   dry_run: true  (default) — preflight + typecheck + tests + build + tarball verification
#   dry_run: false           — additionally publish to registry.npmjs.org
#
# Auth: NPM_TOKEN repo secret (granular automation token, @aiti-ai scope read/write).
# Upgrade path (token-free): npmjs Trusted Publishing (OIDC) — bind the package on
# npmjs.com to this repo + this workflow file, then enable --provenance and drop
# NODE_AUTH_TOKEN. The first publish still needs a token.

name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify only, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write # npm provenance, once Trusted Publishing is bound

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org" # writes ~/.npmrc for NODE_AUTH_TOKEN

      - name: Preflight — registry identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      # No package-lock is committed on purpose: the only runtime dep set is dev
      # tooling (typescript/@types/node), so a plain install is deterministic enough
      # and avoids stale private-registry URLs in the lock.
      - name: Install dev deps
        run: npm install --include=dev --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (all green or no publish)
        run: npm test

      - name: Build
        run: npm run build

      - name: Rebuild catalog index (must match the committed .sxcu files)
        run: |
          npm run build:catalog
          git diff --exit-code catalog/index.json || {
            echo "::error::catalog/index.json is stale — run 'npm run build:catalog' locally and commit";
            exit 1;
          }

      - name: Pack — verify tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const p = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0];
            const files = p.files.map(f => f.path.replace(/^package\//, ''));
            const mustHave = ['dist/index.js', 'dist/index.d.ts', 'dist/cli.js',
                              'catalog/index.json', 'catalog/sharex/catbox.moe.sxcu',
                              'catalog/aiti/joplin.sxcu', 'README.md', 'README.zh-CN.md',
                              'docs/design.md', 'docs/api.md', 'docs/custom-uploader-guide.md'];
            const missing = mustHave.filter(f => !files.includes(f));
            if (missing.length) { console.error('missing from tarball: ' + missing.join(', ')); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('test/'));
            if (leaked.length) { console.error('test files leaked into the tarball: ' + leaked.join(', ')); process.exit(1); }
            const sxcu = files.filter(f => f.endsWith('.sxcu')).length;
            console.log('tarball ok: ' + files.length + ' files (' + sxcu + ' .sxcu configs)');
            if (sxcu < 150) { console.error('catalog incomplete: only ' + sxcu + ' configs'); process.exit(1); }
          "

      - name: Publish
        if: ${{ inputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Trusted Publishing upgrade: drop NODE_AUTH_TOKEN, add --provenance
        run: npm publish --access public

      - name: Summary
        run: |
          echo "### @aiti-ai/content-share" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry_run: \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`$(node -p "require('./package.json').version")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- catalog: \`$(node -p "require('./catalog/index.json').count")\` targets" >> "$GITHUB_STEP_SUMMARY"
